<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760"><rect width="100%" height="100%" fill="#fbfaf6"/>
<text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#111" font-weight="700">Two Rock Classic Reverb Signature 100 — V2 signal flow modelled by the plugin</text>
<text x="24" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="start" fill="#444">Built from the owner's manual's control descriptions + front-panel photo. Two Rock publishes no schematic: stage internals are a reconstruction.</text>
<rect x="24" y="90" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="131.5" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">INPUT</text>
<text x="131.5" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">guitar</text>
<polyline points="239,150 261,150" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="253,145 253,155 261,150" fill="#222"/>
<rect x="261" y="90" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="368.5" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">FET stage</text>
<text x="368.5" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">FET switch · FET GAIN ±14 dB</text>
<text x="368.5" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">(below noon also cuts bass)</text>
<polyline points="476,150 498,150" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="490,145 490,155 498,150" fill="#222"/>
<rect x="498" y="90" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="605.5" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">GAIN STRUCTURE</text>
<text x="605.5" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">Down: scooped, less gain</text>
<text x="605.5" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">Middle: hottest</text>
<text x="605.5" y="174" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">Up: classic Two-Rock</text>
<polyline points="713,150 735,150" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="727,145 727,155 735,150" fill="#222"/>
<rect x="735" y="90" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="842.5" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">V1  12AX7</text>
<text x="842.5" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">gain stage</text>
<polyline points="950,150 972,150" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="964,145 964,155 972,150" fill="#222"/>
<rect x="972" y="90" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="1079.5" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">GAIN pot</text>
<text x="1079.5" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">+ BRIGHT (cap across pot)</text>
<text x="1079.5" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">more gain adds bass</text>
<polyline points="1187,150 1209,150" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="1201,145 1201,155 1209,150" fill="#222"/>
<rect x="1209" y="90" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="1316.5" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">EQ1 / EQ2</text>
<text x="1316.5" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">EQ1: lower gain, fuller</text>
<text x="1316.5" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">EQ2: tighter, more gain</text>
<rect x="24" y="260" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="131.5" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">TREBLE · MIDDLE · BASS</text>
<text x="131.5" y="312" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">TMB stack · BYPASS = all up</text>
<polyline points="239,320 261,320" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="253,315 253,325 261,320" fill="#222"/>
<rect x="261" y="260" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="368.5" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">MID switch</text>
<text x="368.5" y="312" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">+4.5 dB around 650 Hz</text>
<polyline points="476,320 498,320" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="490,315 490,325 498,320" fill="#222"/>
<rect x="498" y="260" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="605.5" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">DEEP switch</text>
<text x="605.5" y="312" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">+5 dB low shelf, tighter mud</text>
<polyline points="713,320 735,320" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="727,315 727,325 735,320" fill="#222"/>
<rect x="735" y="260" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="842.5" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">V4  12AX7</text>
<text x="842.5" y="312" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">mix / recovery</text>
<polyline points="950,320 972,320" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="964,315 964,325 972,320" fill="#222"/>
<rect x="972" y="260" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="1079.5" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">REVERB</text>
<text x="1079.5" y="312" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">SEND → 12AT7 → spring → RETURN</text>
<text x="1079.5" y="328" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">send sets drive+decay</text>
<polyline points="1187,320 1209,320" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="1201,315 1201,325 1209,320" fill="#222"/>
<rect x="1209" y="260" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="1316.5" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">CONTOUR</text>
<text x="1316.5" y="312" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">CCW: darker, more low end</text>
<text x="1316.5" y="328" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">CW: brighter, less low end</text>
<rect x="24" y="430" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="131.5" y="456" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">MASTER</text>
<text x="131.5" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">pre-PI level</text>
<polyline points="239,490 261,490" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="253,485 253,495 261,490" fill="#222"/>
<rect x="261" y="430" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="368.5" y="456" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">V5 12AX7 PI</text>
<text x="368.5" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">long-tail pair + NFB (~4.5 dB)</text>
<polyline points="476,490 498,490" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="490,485 490,495 498,490" fill="#222"/>
<rect x="498" y="430" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="605.5" y="456" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">4× 6L6GC</text>
<text x="605.5" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">push-pull, fixed bias</text>
<text x="605.5" y="498" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">100 W / 50 W switch</text>
<polyline points="713,490 735,490" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="727,485 727,495 735,490" fill="#222"/>
<rect x="735" y="430" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="842.5" y="456" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">Output transformer</text>
<text x="842.5" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">+ speaker impedance model</text>
<polyline points="950,490 972,490" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="964,485 964,495 972,490" fill="#222"/>
<rect x="972" y="430" width="215" height="120" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.4"/>
<text x="1079.5" y="456" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">Cab / IR</text>
<text x="1079.5" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">modelled cab or your IR</text>
<polyline points="1187,490 1209,490" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="1201,485 1201,495 1209,490" fill="#222"/>
<rect x="1209" y="430" width="215" height="120" rx="6" fill="#f6efe2" stroke="#222" stroke-width="1.4"/>
<text x="1316.5" y="456" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#111" font-weight="700">STANDBY</text>
<text x="1316.5" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#333">mutes output</text>
<text x="24" y="600" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#111" font-style="italic">Switch/knob effects are my interpretation of the manual's wording (e.g. exact shelf frequencies); the numbers live in AmpEngine::setControls() and are easy to retune.</text>
<text x="24" y="620" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#111" font-style="italic">100 W model: solid-state rectifier (the tube rectifier is a 50 W-model feature). 50 W setting = two output tubes, doubled primary impedance, -3 dB.</text>
<text x="24" y="640" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#111" font-style="italic">Pedal version: the JFET + op-amp pedal on drawing 04 maps to FET stage → V1 → stack → drive; reverb/contour/switches are not in the pedal.</text>
</svg>